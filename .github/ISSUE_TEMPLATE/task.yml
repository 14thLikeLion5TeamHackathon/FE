name: 작업 관리
description: 문서, 설정, 공통 작업을 등록합니다.
title: 'chore: '
labels: ['chore']
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options:
        - docs
        - chore
        - design
        - refactor
        - test
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      description: 필요한 작업을 간단히 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true
