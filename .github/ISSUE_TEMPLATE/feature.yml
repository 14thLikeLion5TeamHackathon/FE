name: 기능 개발
description: 새로운 기능이나 화면 개발 작업을 등록합니다.
title: 'feat: '
labels: ['feature']
body:
  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      description: 구현할 기능이나 화면을 간단히 설명해 주세요.
      placeholder: 예) 로그인 페이지 UI를 구현합니다.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      description: 필요한 작업을 체크리스트로 작성해 주세요.
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 디자인, 노션, API 문서 등 참고할 자료가 있다면 작성해 주세요.
      placeholder: 예) Figma 링크, 노션 링크
    validations:
      required: false
