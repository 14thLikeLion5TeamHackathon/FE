name: 버그 수정
description: 오류나 예상과 다른 동작을 등록합니다.
title: 'fix: '
labels: ['bug']
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 어떤 문제가 발생했는지 설명해 주세요.
      placeholder: 예) 모바일 화면에서 버튼이 화면 밖으로 벗어납니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 순서를 작성해 주세요.
      value: |
        1. 
        2. 
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 기대한 동작을 작성해 주세요.
    validations:
      required: true
