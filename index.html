<!doctype html>
<!-- lang="en"(Vite 기본값)이면 크롬이 영어 페이지로 보고 한국어 UI를 재번역해 문구가 깨진다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS 홈 화면 추가용. 없으면 사파리가 화면을 캡처해 아이콘으로 쓴다. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 다크 배경 서비스: 로드 전 흰 화면이 번쩍이지 않게 브라우저 UI 색을 맞춘다. -->
    <meta name="theme-color" content="#131416" />
    <!-- 본문이 제일 먼저 그려지는 굵기라 Regular만 미리 받는다. Medium/Bold는 필요할 때 로드. -->
    <link
      rel="preload"
      href="/fonts/Pretendard-Regular.subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>마디</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
